<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#04060c">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Arise</title>
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" type="image/png" href="icon-192.png">
<meta name="apple-mobile-web-app-title" content="Arise">

<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@500;600;700&family=Rajdhani:wght@500;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#04060c;--panel:rgba(8,18,38,.84);--panel2:rgba(14,30,60,.7);--line:rgba(110,200,255,.42);--glow:#3aa0ff;--cyan:#7fe6ff;--txt:#dbe9ff;--dim:#8193b8;--gold:#ffd166;--red:#ff4d6d;--green:#4ef0a0;--purple:#b388ff}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--txt);font-family:'Rajdhani',system-ui,sans-serif;font-size:17px;font-weight:600}
body{min-height:100vh;min-height:100dvh;background:radial-gradient(ellipse at 50% -10%,#0f2a5a 0%,transparent 60%),radial-gradient(ellipse at 100% 110%,#1d0c40 0%,transparent 55%),var(--bg);background-attachment:fixed;overscroll-behavior-y:none}
body::after{content:'';position:fixed;inset:0;pointer-events:none;background:repeating-linear-gradient(0deg,rgba(255,255,255,.018) 0 1px,transparent 1px 3px);z-index:1}
button,input,select,textarea{font:inherit;color:inherit}
#app{position:relative;z-index:2;max-width:520px;margin:0 auto;padding:calc(env(safe-area-inset-top) + 10px) 14px calc(env(safe-area-inset-bottom) + 96px)}
.h{font-family:'Chakra Petch',sans-serif;letter-spacing:.1em;text-transform:uppercase}
.win{position:relative;background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:14px;margin:12px 0;box-shadow:0 0 18px rgba(58,160,255,.16),inset 0 0 26px rgba(58,160,255,.07)}
.win::before,.win::after{content:'';position:absolute;width:12px;height:12px;border:2px solid var(--cyan);pointer-events:none;filter:drop-shadow(0 0 4px var(--cyan))}
.win::before{top:-2px;left:-2px;border-right:0;border-bottom:0}
.win::after{bottom:-2px;right:-2px;border-left:0;border-top:0}
.wt{font-family:'Chakra Petch';font-size:12.5px;letter-spacing:.24em;color:var(--cyan);text-transform:uppercase;display:flex;align-items:center;gap:8px;margin-bottom:10px;text-shadow:0 0 8px rgba(127,230,255,.6)}
.wt::before{content:'◆';font-size:10px}
.wt .sp{flex:1}
.dim{color:var(--dim)}
.small{font-size:14px}
.tiny{font-size:12.5px}
.row{display:flex;align-items:center;gap:10px}
.between{justify-content:space-between}
.grow{flex:1;min-width:0}
.btn{appearance:none;border:1px solid var(--line);background:linear-gradient(180deg,rgba(40,90,170,.35),rgba(10,30,70,.5));color:var(--txt);border-radius:5px;padding:10px 14px;font-family:'Chakra Petch';font-size:14px;letter-spacing:.1em;text-transform:uppercase;cursor:pointer;box-shadow:0 0 10px rgba(58,160,255,.15);transition:transform .08s,box-shadow .2s}
.btn:active{transform:scale(.97)}
.btn.pri{border-color:var(--cyan);background:linear-gradient(180deg,rgba(60,160,255,.55),rgba(20,70,160,.6));box-shadow:0 0 16px rgba(127,230,255,.35)}
.btn.gold{border-color:var(--gold);color:#fff3cc;background:linear-gradient(180deg,rgba(255,190,60,.4),rgba(120,70,0,.45));box-shadow:0 0 18px rgba(255,209,102,.35)}
.btn.red{border-color:rgba(255,77,109,.7);background:linear-gradient(180deg,rgba(255,77,109,.3),rgba(90,10,30,.45))}
.btn.ghost{background:transparent;box-shadow:none}
.btn.sm{padding:6px 10px;font-size:12px}
.btn.block{display:block;width:100%}
.btn:disabled{opacity:.4}
.ico{width:38px;height:38px;padding:0;display:inline-grid;place-items:center;font-size:18px}
html,body,button,input,select,textarea,label,a{touch-action:manipulation}
input,select,textarea{font-size:16px}
input.f,select.f,textarea.f{width:100%;background:rgba(0,10,30,.6);border:1px solid rgba(110,200,255,.3);border-radius:4px;padding:9px 10px;color:var(--txt);outline:none}
input.f:focus,select.f:focus,textarea.f:focus{border-color:var(--cyan);box-shadow:0 0 8px rgba(127,230,255,.35)}
label.l{display:block;font-size:13px;color:var(--dim);margin:10px 0 4px;letter-spacing:.06em;text-transform:uppercase}
.bar{height:10px;background:rgba(0,10,30,.8);border:1px solid rgba(110,200,255,.3);border-radius:3px;overflow:hidden}
.bar>i{display:block;height:100%;background:linear-gradient(90deg,#1f6fff,var(--cyan));box-shadow:0 0 10px var(--cyan);transition:width .5s}
.bar.hp>i{background:linear-gradient(90deg,#ff2d55,#ff8a5c);box-shadow:0 0 10px #ff4d6d}
.bar.gold>i{background:linear-gradient(90deg,#ff9f1c,var(--gold));box-shadow:0 0 10px var(--gold)}
.rank{display:inline-grid;place-items:center;min-width:30px;height:30px;padding:0 6px;border:1.5px solid currentColor;border-radius:4px;font-family:'Chakra Petch';font-weight:700;font-size:16px;text-shadow:0 0 8px currentColor;box-shadow:0 0 8px currentColor inset}
.rE{color:#a9b4c8}.rD{color:#4ef0a0}.rC{color:#4fb8ff}.rB{color:#b388ff}.rA{color:#ffd166}.rS{color:#ff4d6d}
.big{font-family:'Chakra Petch';font-size:44px;font-weight:700;line-height:1;text-shadow:0 0 14px rgba(127,230,255,.6)}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.stat{background:var(--panel2);border:1px solid rgba(110,200,255,.22);border-radius:4px;padding:8px 10px}
.stat b{font-family:'Chakra Petch';font-size:22px;color:#fff}
.stat .k{font-family:'Chakra Petch';letter-spacing:.15em;font-size:12px;color:var(--cyan)}
.pill{display:inline-block;padding:2px 8px;border:1px solid rgba(110,200,255,.35);border-radius:20px;font-size:12.5px;color:var(--dim)}
.list>*+*{border-top:1px solid rgba(110,200,255,.14)}
.item{padding:10px 0}
.tabs{position:fixed;z-index:20;left:0;right:0;bottom:0;padding:8px 10px calc(env(safe-area-inset-bottom) + 8px);background:linear-gradient(180deg,rgba(4,6,12,.4),rgba(4,6,12,.96) 35%);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px)}
.tabs .in{max-width:440px;margin:0 auto;padding:0 18px;display:grid;grid-template-columns:repeat(5,1fr);gap:2px}
.tab{background:transparent;border:1px solid transparent;border-radius:6px;padding:6px 0 4px;color:var(--dim);font-family:'Chakra Petch';font-size:10px;letter-spacing:.06em;text-transform:uppercase;display:flex;flex-direction:column;align-items:center;gap:2px;cursor:pointer}
.tab svg{width:24px;height:24px}
.tab.on{color:var(--cyan);border-color:rgba(127,230,255,.35);background:rgba(30,90,180,.18);text-shadow:0 0 8px var(--cyan)}
.tab.on svg{filter:drop-shadow(0 0 5px var(--cyan))}
.topbar{display:flex;align-items:center;justify-content:space-between;margin:2px 0 4px}
.logo{font-family:'Chakra Petch';font-weight:700;letter-spacing:.42em;font-size:19px;color:var(--cyan);text-shadow:0 0 10px var(--cyan)}
.sync{font-size:11.5px;letter-spacing:.08em;color:var(--dim);display:flex;align-items:center;gap:6px}
.sync i{width:7px;height:7px;border-radius:50%;background:var(--dim)}
.sync.ok i{background:var(--green);box-shadow:0 0 6px var(--green)}
.sync.busy i{background:var(--gold);box-shadow:0 0 6px var(--gold)}
.sync.err i{background:var(--red)}
.gate{position:relative;overflow:hidden}
.portal{position:absolute;right:-34px;top:-34px;width:120px;height:120px;border-radius:50%;opacity:.3;pointer-events:none;border:2px dashed currentColor;box-shadow:0 0 28px currentColor,inset 0 0 28px currentColor;animation:spin 14s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.qrow{display:flex;align-items:center;gap:8px;padding:9px 0}
.qrow .nm{flex:1;min-width:0}
.qrow .cnt{font-family:'Chakra Petch';font-size:15px;min-width:86px;text-align:right}
.qrow.done .nm,.qrow.done .cnt{color:var(--green);text-shadow:0 0 8px rgba(78,240,160,.5)}
.warn{color:var(--red);font-size:14px;text-align:center;margin-top:10px;text-shadow:0 0 8px rgba(255,77,109,.5)}
/* overlays */
.ov{position:fixed;inset:0;z-index:40;background:rgba(2,4,10,.72);backdrop-filter:blur(3px);-webkit-backdrop-filter:blur(3px);display:flex;align-items:flex-end;justify-content:center;animation:fade .18s}
.sheet{width:100%;max-width:520px;max-height:92vh;max-height:92dvh;overflow:auto;background:#060d1c;border:1px solid var(--line);border-bottom:0;border-radius:12px 12px 0 0;padding:16px 16px calc(env(safe-area-inset-bottom) + 20px);box-shadow:0 -10px 40px rgba(58,160,255,.2);animation:up .22s ease-out}
.ov.center{align-items:center;padding:20px}
.sx{position:sticky;top:-4px;float:right;z-index:5;width:34px;height:34px;margin:-6px -6px 4px 10px;padding:0;border-radius:50%;background:rgba(6,13,28,.92);border:1px solid rgba(110,200,255,.35);color:#cfe6ff;font-size:15px;line-height:1;cursor:pointer;display:grid;place-items:center}.sx:active{background:rgba(40,90,170,.5)}
.pktabs{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-top:8px}.pktabs button{background:var(--panel2);border:1px solid rgba(110,200,255,.2);border-radius:6px;padding:8px 6px;color:var(--dim);font:inherit;font-size:12px;letter-spacing:.08em;text-transform:uppercase;cursor:pointer;display:flex;justify-content:center;gap:6px;align-items:center}.pktabs button span{font-size:11px;opacity:.75;letter-spacing:0}.pktabs button.on{color:var(--txt);border-color:var(--cyan);box-shadow:0 0 10px rgba(110,200,255,.25) inset}
.pklist{display:flex;flex-direction:column;gap:6px;margin-top:8px}
.pk{display:block;width:100%;background:var(--panel2);border:1px solid rgba(110,200,255,.18);border-left:3px solid var(--rc,#556);border-radius:6px;padding:9px 10px;color:var(--txt);font:inherit;cursor:pointer}
.pk.on{border-color:var(--rc);box-shadow:0 0 12px color-mix(in srgb,var(--rc) 45%,transparent) inset}
.pk .pki{font-size:22px;line-height:1.2;width:28px;text-align:center}.pk .pkd{font-style:italic;color:#c9d8ee;margin:3px 0;line-height:1.4}
.pk.lock{filter:grayscale(1);opacity:.42;border-left-color:#444;cursor:default}.pk.lock .h,.pk.lock .tiny,.pk.lock .pkd{color:#9aa}
.pk.myth{animation:myth 2.4s ease-in-out infinite}@keyframes myth{50%{box-shadow:0 0 16px rgba(255,59,92,.55)}}
.pk.myth0{filter:none;opacity:.75;background:#140409;border:1px dashed #5a1a28;border-left:3px solid #5a1a28}
.sheet.shrink{transition:transform .22s ease-in,opacity .22s ease-in;transform:scale(.6);opacity:0}.ov.fade{transition:background .22s;background:transparent!important}
.ov.center .sheet{border-radius:8px;border-bottom:1px solid var(--line);max-height:86vh;padding-bottom:18px}
@keyframes up{from{transform:translateY(40px);opacity:0}}
@keyframes fade{from{opacity:0}}
#raid{position:fixed;inset:0;z-index:30;overflow:auto;background:radial-gradient(ellipse at 50% -20%,#3a0b1e 0%,transparent 55%),radial-gradient(ellipse at 50% 120%,#0b1e44 0%,transparent 60%),#04060c;padding:calc(env(safe-area-inset-top) + 10px) 14px calc(env(safe-area-inset-bottom) + 120px)}
#raid .wrap{max-width:520px;margin:0 auto}
.setrow{display:grid;grid-template-columns:30px 1fr 18px 1fr 44px;gap:6px;align-items:center;padding:5px 0}
.setrow.t{grid-template-columns:30px 1fr 44px}
.setrow input{text-align:center;font-family:'Chakra Petch';font-size:17px;padding:8px 4px}
.setrow .n{font-family:'Chakra Petch';color:var(--dim);text-align:center}
.chk{width:44px;height:40px;border:1px solid var(--line);border-radius:5px;background:rgba(0,10,30,.6);display:grid;place-items:center;font-size:20px;color:transparent;cursor:pointer}
.setrow.done .chk{background:rgba(78,240,160,.2);border-color:var(--green);color:var(--green);box-shadow:0 0 10px rgba(78,240,160,.4)}
.setrow.done input{border-color:rgba(78,240,160,.45);color:#c9ffe6}
.mon{font-family:'Chakra Petch';font-size:12px;letter-spacing:.18em;text-transform:uppercase;color:#ff8aa0}
.mon.boss{color:var(--gold);text-shadow:0 0 8px var(--gold)}
.slain{opacity:.62}
.slain .mon::after{content:' — SLAIN';color:var(--green)}
.rest{position:fixed;z-index:35;left:50%;transform:translateX(-50%);bottom:calc(env(safe-area-inset-bottom) + 76px);width:calc(100% - 28px);max-width:492px;background:#081530;border:1px solid var(--cyan);border-radius:8px;padding:10px 12px;box-shadow:0 0 22px rgba(127,230,255,.35);display:none}
.rest.on{display:block;animation:up .2s}
.rest .t{font-family:'Chakra Petch';font-size:26px;font-weight:700;min-width:70px}
.raidfoot{position:fixed;z-index:34;left:0;right:0;bottom:0;padding:10px 14px calc(env(safe-area-inset-bottom) + 10px);background:linear-gradient(180deg,transparent,rgba(4,6,12,.97) 30%)}
.raidfoot .in{max-width:520px;margin:0 auto;display:flex;gap:8px}
#toasts{position:fixed;z-index:60;left:0;right:0;top:calc(env(safe-area-inset-top) + 10px);display:flex;flex-direction:column;align-items:center;gap:8px;pointer-events:none;padding:0 14px}
.toast{max-width:480px;width:100%;background:rgba(6,16,36,.96);border:1px solid var(--cyan);border-radius:6px;padding:10px 14px;box-shadow:0 0 22px rgba(127,230,255,.35);animation:drop .3s ease-out;font-size:15.5px}
.toast b{color:var(--cyan)}
.toast.gold{border-color:var(--gold);box-shadow:0 0 22px rgba(255,209,102,.35)}
.toast.gold b{color:var(--gold)}
.toast.red{border-color:var(--red);box-shadow:0 0 22px rgba(255,77,109,.35)}
.toast.red b{color:var(--red)}
@keyframes drop{from{transform:translateY(-20px);opacity:0}}
.sys{text-align:center}
.sys .h1{font-family:'Chakra Petch';font-weight:700;font-size:26px;letter-spacing:.14em;color:#fff;text-shadow:0 0 16px var(--cyan)}
.sys.gold .h1{text-shadow:0 0 16px var(--gold);color:#fff6d8}
.lvlup{font-family:'Chakra Petch';font-weight:700;font-size:40px;letter-spacing:.12em;color:var(--gold);text-shadow:0 0 20px var(--gold);animation:pulse 1.2s ease-in-out infinite}
@keyframes pulse{50%{text-shadow:0 0 34px var(--gold),0 0 6px #fff}}
.cls{display:grid;gap:8px}
.clsc{border:1px solid rgba(110,200,255,.3);border-radius:6px;padding:10px 12px;background:var(--panel2);cursor:pointer;text-align:left}
.clsc.on{border-color:var(--cyan);box-shadow:0 0 14px rgba(127,230,255,.35)}
.seg{display:flex;border:1px solid var(--line);border-radius:5px;overflow:hidden}
.seg button{flex:1;background:transparent;border:0;padding:8px;cursor:pointer;color:var(--dim);font-family:'Chakra Petch';letter-spacing:.1em}
.seg button.on{background:rgba(60,160,255,.35);color:#fff}
.title{display:flex;align-items:center;gap:10px;padding:9px 0}
.title .tic{width:34px;height:34px;border-radius:5px;display:grid;place-items:center;border:1px solid rgba(110,200,255,.3);font-size:17px;flex:none}
.title.locked{opacity:.6}
.title.eq .tic{border-color:var(--gold);box-shadow:0 0 10px rgba(255,209,102,.5)}
.pick{padding:10px 2px;cursor:pointer;display:flex;align-items:center;gap:8px}
.statdot{font-family:'Chakra Petch';font-size:11px;letter-spacing:.1em;padding:1px 6px;border-radius:3px;border:1px solid currentColor}
.sSTR{color:#ff8a5c}.sVIT{color:#4ef0a0}.sAGI{color:#7fe6ff}.sEND{color:#b388ff}
.chart text{fill:var(--dim);font-size:10px;font-family:'Chakra Petch'}
.empty{text-align:center;color:var(--dim);padding:18px 6px}
.flash{position:fixed;inset:0;z-index:55;pointer-events:none;background:radial-gradient(circle,rgba(127,230,255,.35),transparent 70%);animation:fl .7s forwards}
@keyframes fl{to{opacity:0}}
.mono{font-family:'Chakra Petch'}
details summary{cursor:pointer;list-style:none}
details summary::-webkit-details-summary{display:none}
.hide{display:none!important}
.authov{position:fixed;inset:0;z-index:70;display:flex;align-items:center;justify-content:center;padding:20px;background:radial-gradient(ellipse at 50% -10%,#0f2a5a 0%,transparent 60%),#04060c}
.authov.hide{display:none}.authbox{width:100%;max-width:420px}
.lbrow.me{background:rgba(127,230,255,.07);border-radius:5px}.lbpos{width:30px;text-align:center;font-family:'Chakra Petch';font-size:18px}
.portalspin{width:90px;height:120px;margin:0 auto;border-radius:50%;border:3px dashed var(--cyan);box-shadow:0 0 24px rgba(127,230,255,.5),inset 0 0 24px rgba(127,230,255,.4);animation:spin 3s linear infinite}
.sync{cursor:pointer}
.manual ul{margin:6px 0;padding-left:18px}.manual li{margin:4px 0}.manual p{margin:6px 0}.manual b{color:var(--cyan)}.manual details[open] summary .tiny{transform:rotate(180deg)}
/* Fit to the visible screen when shown inside the Claude app */
html.embed,html.embed body{height:var(--avail);overflow:hidden}
html.embed #app{height:var(--avail);overflow-y:auto;-webkit-overflow-scrolling:touch;overscroll-behavior:contain}
html.embed .tabs{bottom:auto;top:calc(var(--avail) - var(--tabh,74px))}
html.embed .tabs{padding-bottom:calc(env(safe-area-inset-bottom) + 22px)}
html.embed .raidfoot{padding-bottom:calc(env(safe-area-inset-bottom) + 22px)}
html.embed #app{padding-bottom:120px}
html.embed #raid{bottom:auto;height:var(--avail)}
html.embed .raidfoot{bottom:auto;top:calc(var(--avail) - var(--rfh,64px))}
html.embed .rest,html.embed #circ{bottom:auto;top:calc(var(--avail) - var(--rfh,64px) - 10px);transform:translate(-50%,-100%);animation:none}
html.embed .ov{bottom:auto;height:var(--avail)}
html.embed .sheet{max-height:calc(var(--avail) * .92)}
html.embed .ov.center .sheet{max-height:calc(var(--avail) * .86)}
html.embed body::after{height:var(--avail)}

.sscard{border-color:rgba(179,136,255,.5)}.sscard::before,.sscard::after{border-color:var(--purple)}
.ssmember{padding:8px 0;border-bottom:1px dashed rgba(179,136,255,.25)}.ssmember:last-of-type{border-bottom:0}
.sslbl{display:inline-block;font-family:'Chakra Petch';font-size:12px;color:var(--purple);border:1px solid var(--purple);border-radius:3px;padding:0 4px;letter-spacing:.04em}
.setrow .n.sslbl{border:0;padding:0;font-size:13px}
.ssround{margin-top:8px;padding:6px 8px;border-left:2px solid rgba(179,136,255,.5);border-radius:3px;background:rgba(179,136,255,.05)}.ssround.rdone{border-left-color:var(--green);opacity:.75}
.setrow{grid-template-columns:26px 1fr 12px 60px 44px!important}.setrow.t{grid-template-columns:26px 1fr 44px!important}
.wgrp{display:flex;align-items:stretch;gap:3px;min-width:0}.wgrp input{flex:1;min-width:0}.stp{width:30px;flex:none;background:rgba(40,90,170,.3);border:1px solid rgba(110,200,255,.3);border-radius:4px;color:var(--cyan);font-size:18px;cursor:pointer;padding:0}
.setrow.live{background:rgba(179,136,255,.14);border-radius:5px;box-shadow:0 0 12px rgba(179,136,255,.35)}
.sug{display:flex;align-items:center;gap:6px;margin-top:6px;padding:6px 8px;border:1px solid rgba(255,209,102,.6);border-radius:4px;background:rgba(255,209,102,.08);font-size:13.5px;color:#ffe6a6}
.circbox{border-color:rgba(179,136,255,.55)}.circbox::before,.circbox::after{border-color:var(--purple)}
#circ{position:fixed;z-index:36;left:50%;transform:translateX(-50%);bottom:calc(env(safe-area-inset-bottom) + 76px);width:calc(100% - 28px);max-width:492px;background:#120a26;border:1px solid var(--purple);border-radius:10px;padding:12px 14px;box-shadow:0 0 26px rgba(179,136,255,.45);display:none}
#circ.on{display:block;animation:up .2s}#circ .ct{font-family:'Chakra Petch';font-size:54px;font-weight:700;line-height:1;min-width:84px;text-align:center;text-shadow:0 0 16px var(--purple)}
.sstag{display:inline-block;margin-left:4px;padding:0 6px;border:1px solid var(--purple);border-radius:3px;color:var(--purple);letter-spacing:.06em;text-transform:none;font-size:11px}

function computeStats(){
  const st={STR:10,VIT:10,AGI:10,END:10};
  if(S.hunter)st[CLASSES[S.hunter.cls].stat]+=3;
  const c={STR:0,VIT:0,AGI:0,END:0};
  LOGS.forEach(l=>{if(l.side){const a=ACTM[l.side.act]||ACTM.other;a.stats.forEach(k=>c[k]+=l.side.min/5*INT[l.side.int].m/a.stats.length)}});
  LOGS.forEach(l=>l.ex.forEach(e=>{const d=exInfo(e.id);e.sets.forEach(s=>{c[d.stat]+=d.type==='t'?Math.max(1,Math.round((+s.r||0)/5)):1})}));
  for(const k in st)st[k]+=Math.floor(c[k]/4)+Math.floor(S.bonus[k]||0);
  if(S.hunter){st[CLASSES[S.hunter.cls].stat]+=CLASS_BONUS.stat[ctier()];equipped().forEach(g=>st[g.stat]+=g.sv)}
  return st;
}

function rollDaily(){

  $('#tabs').classList.remove('hide');

function msToMidnight(){const n=new Date(),m=new Date(n);m.setHours(24,0,0,0);const s=Math.floor((m-n)/1000);return`${String(Math.floor(s/3600)).padStart(2,'0')}:${String(Math.floor(s%3600/60)).padStart(2,'0')}:${String(s%60).padStart(2,'0')}`}

function renderPlan(){
  if(!S.plan)return`<div class="win"><div class="wt">Training cycle</div><div class="small dim">Set which days you train and which you rest (e.g. 3 on / 1 off). The System will tell you which gate opens each day, and gates cleared on schedule earn <b style="color:var(--cyan)">+20 EXP</b>.</div><button class="btn pri block" style="margin-top:10px" data-a="plan">Set up training cycle</button></div>`;
  const t=today();const days=[];for(let k=-3;k<=10;k++){const ds=addDays(t,k);const pre=ds<S.plan.start;const p=pre?{rest:true}:planFor(ds);const lg=logsOn(ds);
    const [y,m,d]=ds.split('-').map(Number);const dt=new Date(y,m-1,d);
    let st='';if(lg.length)st='<span style="color:var(--green)">✓</span>';else if(k<0&&!p.rest)st='<span style="color:var(--red)">✗</span>';else if(k===0&&!p.rest)st='<span style="color:var(--gold)">◆</span>';
    days.push(`<div class="day ${k===0?'today':''} ${p.rest?'rest':''}" ${k===0?'id="dtoday"':''}><div class="dw">${k===0?'TODAY':dt.toLocaleDateString(undefined,{weekday:'short'}).toUpperCase()}</div><div class="dn">${d}</div><div class="dg">${pre?'—':p.rest?'Rest':esc(p.gate.name)}</div><div class="st">${st}</div></div>`)}
  const on=S.plan.cycle.filter(x=>x!=='rest').length,off=S.plan.cycle.length-on;
  return`<div class="win"><div class="wt">Training cycle<span class="sp"></span><span class="tiny dim">${on} on · ${off} off</span></div><div class="strip" id="strip">${days.join('')}</div>${todayCard(false)}<button class="btn sm ghost block" style="margin-top:8px" data-a="plan">Edit cycle</button></div>`;
}
function todayCard(wrap){const p=planFor(today());if(!p)return'';const done=logsOn(today()).length>0;
  let next='';if(p.rest){for(let k=1;k<=14;k++){const q=planFor(addDays(today(),k));if(!q.rest){next=`Next gate: <b>${esc(q.gate.name)}</b> ${k===1?'tomorrow':'in '+k+' days'}.`;break}}}
  const inner=p.rest?`<div class="row"><div class="grow"><div class="h" style="color:#fff">Rest day</div><div class="small dim">Recovery is part of the System. ${next}</div></div></div>`
   :`<div class="row"><span class="rank r${p.gate.rank}">${p.gate.rank}</span><div class="grow"><div class="tiny dim h">Today's gate${done?' · cleared':''}</div><div class="h" style="color:#fff">${esc(p.gate.name)}</div></div>${done?'<span style="color:var(--green)" class="h">✓</span>':`<button class="btn pri sm" data-a="enter" data-id="${p.gate.id}" ${S.active?'disabled':''}>Enter</button>`}</div>${done?(logsOn(today()).some(l=>l.side)&&!logsOn(today()).some(l=>!l.side)?`<div class="tiny" style="color:var(--green);margin-top:6px">Covered by a side quest</div>`:''):`<button class="btn sm ghost" style="margin-top:6px;padding-left:0;color:var(--green)" data-a="side">Doing something else today? Log a side quest →</button>`}`;
  return wrap?`<div class="win"><div class="wt">Today</div>${inner}</div>`:`<div style="margin-top:8px">${inner}</div>`}
let PE=null;
function openPlanEditor(){PE=S.plan?JSON.parse(JSON.stringify(S.plan)):{start:today(),cycle:[]};if(!PE.cycle.length)applyPreset(3,1);openSheet('<div id="pe"></div>',{onClose:()=>{PE=null}});drawPlanEditor()}
function applyPreset(on,off){const pref=['g2','g3','g4'].filter(id=>S.gates.some(g=>g.id===id));const order=[...pref,...S.gates.map(g=>g.id).filter(id=>!pref.includes(id))];
  const c=[];for(let i=0;i<on;i++)c.push(order.length?order[i%Math.min(order.length,on>=4&&pref.length===3?3:order.length)]:'rest');for(let i=0;i<off;i++)c.push('rest');PE.cycle=c}
function drawPlanEditor(){const el=$('#pe');if(!el||!PE)return;

  <div class="row" style="margin-top:6px"><button class="btn sm" data-a="pe-add" ${PE.cycle.length>=14?'disabled':''}>+ Day</button><button class="btn sm ghost" data-a="pe-rm" ${PE.cycle.length<=1?'disabled':''}>− Day</button></div>
  <div class="row" style="margin-top:16px">${S.plan?'<button class="btn red sm" data-a="pe-clear">Turn off</button>':''}<span class="grow"></span><button class="btn" data-a="close">Cancel</button><button class="btn pri" data-a="pe-save">Save cycle</button></div>`}
function weekStart(d){const x=new Date(d);x.setHours(0,0,0,0);const wd=(x.getDay()+6)%7;x.setDate(x.getDate()-wd);return x}
function renderChron(){
  const ws=weekStart(new Date());const weeks=[];for(let i=7;i>=0;i--){const s=new Date(ws);s.setDate(s.getDate()-7*i);weeks.push({s,sets:0,raids:0})}
  LOGS.forEach(l=>{const w=weekStart(new Date(l.date)).getTime();const k=weeks.find(x=>x.s.getTime()===w);if(k){k.sets+=l.sets||0;k.raids++}});
  const max=Math.max(10,...weeks.map(w=>w.sets));const W=320,H=120,bw=W/8;
  const chart=`<svg class="chart" viewBox="0 0 ${W} ${H+18}" width="100%">${weeks.map((w,i)=>{const h=w.sets/max*H;const x=i*bw+6;return`<rect x="${x}" y="${H-h}" width="${bw-12}" height="${Math.max(h,1)}" rx="2" fill="${i===7?'#7fe6ff':'#2f6fd6'}" opacity="${i===7?1:.75}"/>${w.sets?`<text x="${x+(bw-12)/2}" y="${H-h-4}" text-anchor="middle" style="fill:#dbe9ff">${w.sets}</text>`:''}<text x="${x+(bw-12)/2}" y="${H+14}" text-anchor="middle">${i===7?'NOW':(w.s.getMonth()+1)+'/'+w.s.getDate()}</text>`}).join('')}</svg>`;
  const prs=Object.entries(S.prs).map(([id,p])=>({d:exInfo(id),p})).sort((a,b)=>a.d.name.localeCompare(b.d.name));
  return`<div class="win"><div class="wt">Sets per week</div>${chart}</div>
  <div class="win"><div class="wt">Skill records<span class="sp"></span><span class="tiny dim">tap for progress chart</span></div>
   ${prs.length?`<div class="list">${prs.map(({d,p})=>`<div class="item row pick" data-a="exchart" data-id="${esc(d.id)}"><span class="statdot s${d.stat}">${d.stat}</span><div class="grow">${esc(d.name)}</div><div class="small mono">${prText(d,p)}</div></div>`).join('')}</div>`:`<div class="empty">Clear a gate to start recording skills.</div>`}
  </div>
  <div class="win"><div class="wt">Raid log</div>

     <div class="small" style="margin-top:8px">${l.ex.map(e=>{const d=exInfo(e.id);return`<div style="margin:4px 0"><span class="statdot s${d.stat}">${d.stat}</span> ${esc(d.name)}${(l.prs||[]).includes(e.id)?' <span style="color:var(--gold)">★</span>':''}<div class="dim mono tiny" style="margin-left:4px">${e.sets.map(s=>setFmt(d,s)).join('  ·  ')}</div></div>`}).join('')}

function startRaid(g){
  audioInit();
  RAID_VIEW=true;S.active={gateId:g?g.id:null,name:g?g.name:'Freestyle Raid',start:Date.now(),ex:(g?g.ex:[]).map(e=>newRaidEx(e.id,(+e.sets||0),e.reps,e.wu,e.ss,e.rmax))};
  persist();flash();buzz(40);render();
  sfx('portal');toast(`You have entered <b>${esc(S.active.name)}</b>.`,'', '[Gate]',true);
}
function newRaidEx(id,sets,reps,wu,ss,rmax){const d=exInfo(id);const last=lastSets(id);const out=[];const n=Math.max(1,+sets||3);
  for(let i=0;i<n;i++){const ls=last?(last[i]||last[last.length-1]):null;out.push({w:d.type==='w'?(ls?ls.w:''):'',r:reps!==undefined&&reps!==''?reps:(ls?ls.r:''),done:false,wu:i<(+wu||0)?1:0})}
  const o={id,sets:out,target:(+rmax>+reps?+rmax:+reps)||null};if(+rmax>+reps)o.rr=reps+'–'+rmax;if(ss)o.ss=ss;return o}
let raidTick=null;
function tickElapsed(){const el=$('#elapsed');if(!el||!S.active){clearInterval(raidTick);return}const s=Math.floor((Date.now()-S.active.start)/1000);el.textContent=(s>=3600?Math.floor(s/3600)+':':'')+String(Math.floor(s%3600/60)).padStart(2,'0')+':'+String(s%60).padStart(2,'0')}

let restEnd=0,restTotal=0,restTimer=null;
function startRest(sec){restTotal=sec;restEnd=Date.now()+sec*1000;$('#rest').classList.add('on');clearInterval(restTimer);restTimer=setInterval(tickRest,250);tickRest()}
function tickRest(){const left=Math.max(0,Math.ceil((restEnd-Date.now())/1000));$('#restT').textContent=Math.floor(left/60)+':'+String(left%60).padStart(2,'0');$('#restB').style.width=(restTotal?left/restTotal*100:0)+'%';
  if(left<=0){clearInterval(restTimer);sfx('restEnd');buzz([120,80,120]);$('#restT').textContent='GO';setTimeout(()=>{if(restEnd<=Date.now())$('#rest').classList.remove('on')},2500)}}
function stopRest(){clearInterval(restTimer);restEnd=0;$('#rest').classList.remove('on')}

function finishRaid(){
  const a=S.active;const doneCount=a.ex.reduce((s,e)=>s+e.sets.filter(x=>x.done).length,0);
  if(!doneCount){toast('No sets completed. Tap ✓ on a set to log it, or Retreat to leave.','red');return}
  const planned=a.ex.reduce((s,e)=>s+e.sets.length,0);
  const log={id:uid(),date:new Date(a.start).toISOString(),gateId:a.gateId,gateName:a.name,dur:Math.max(1,Math.round((Date.now()-a.start)/60000)),ex:[],sets:0,vol:0,xp:0,prs:[]};
  const newPRs=[];const k=U()==='kg'?2.2046:1;
  a.ex.forEach(e=>{const d=exInfo(e.id);const done=e.sets.filter(s=>s.done);if(!done.length)return;
    log.ex.push({id:e.id,sets:done.map(s=>s.wu?{w:+s.w||0,r:+s.r||0,wu:1}:{w:+s.w||0,r:+s.r||0})});log.sets+=done.length;
    done.forEach(s=>{if(d.type==='w')log.vol+=(+s.w||0)*(+s.r||0)*k});
    const b=bestMetric(d,done),prev=S.prs[e.id];
    if(b&&(!prev||b.m>prev.m+1e-9)){if(prev){newPRs.push({d,b});log.prs.push(e.id);S.prCount=(S.prCount||0)+1}S.prs[e.id]={...b,date:log.date}}});
  log.vol=Math.round(log.vol);
  const fullClear=doneCount>=planned;
  log.crank=scoreRank(doneScore(a));
  /* EXP from work done, same scale as gate rank: weighted 1, bodyweight 0.8, timed holds 0.7/min, cardio 1 per 3 min (max 15).
     Warm-ups count. Max 6 sets per exercise. */
  let pts=0;a.ex.forEach(e=>{const d=exInfo(e.id);const ds=e.sets.filter(x=>x.done).slice(0,6);if(!ds.length)return;
    if(d.type==='t'&&!isSec(d)){pts+=Math.min(15,ds.slice(0,3).reduce((t,x)=>t+Math.min(15,(+x.r||0)/3),0));return}
    ds.forEach(x=>{const r=+x.r||0;pts+=d.type==='t'?Math.min(1,r*0.7):d.type==='bw'?(r>0&&r<=2?0.4:r>0?0.8:0):(r>0?1:0)})});
  const setXp=Math.round(10*pts);log.work=+pts.toFixed(1);
  const parts=[[`${log.sets} sets defeated · ${log.work} work`,setXp],['Gate cleared',50]];
  if(fullClear)parts.push(['Full clear bonus',25]);
  {const ds=today(new Date(a.start)),p=planFor(ds);if(p&&!p.rest&&p.gate.id===a.gateId&&!logsOn(ds).some(l=>l.gateId===a.gateId)){parts.push(['On schedule',20]);S.onSched=(S.onSched||0)+1}}
  if(newPRs.length)parts.push([`${newPRs.length} new record${newPRs.length>1?'s':''}${newPRs.length>3?' (3 max)':''}`,Math.min(3,newPRs.length)*30]);
  const base=parts.reduce((s,p)=>s+p[1],0),xb=xpBonus();if(xb>0)parts.push([`Gear & class bonus (+${Math.round(xb*100)}%)`,Math.round(base*xb)]);
  const fl0=S.tower.floor;const climb=awardSteps(log);
  LOGS.unshift(log);
  const fights=bossesOnRaid(log);const wins=fights.filter(f=>f.win).map(f=>f.win);
  wins.forEach(w=>parts.push([`Defeated ${w.boss.name}`,w.xp]));
  const drop=rollDrop(log);
  log.xp=parts.reduce((s,p)=>s+p[1],0);log.full=fullClear;
  S.active=null;stopRest();stopCirc();clearInterval(raidTick);
  const res=gainXp(log.xp);rollTower();
  checkAch();persist([log.date.slice(0,7)],true);
  $('#raid').classList.add('hide');TAB='gates';
  const L=res.after;const T=S.tower;
  flash();buzz([60,40,60,40,160]);
  let t=0;sfx(wins.length?'bossDefeat':'clear');t+=wins.length?2000:1200;
  if(climb.floors&&climb.floors.length){setTimeout(()=>sfx('climb'),t);t+=600}
  if(newPRs.length){setTimeout(()=>sfx('record'),t);t+=700}
  if(drop){setTimeout(()=>sfx('loot'),t);t+=700}
  if(res.leveled)setTimeout(()=>sfx('levelup'),t);
  const towerLine=climb.amt?`<div class="row between small"><span>▲ +${climb.amt===1?'1 step':'½ step'} <span class="dim">(${esc(climb.reason)})</span></span><span class="mono">${T.steps}/4</span></div>`:`<div class="small dim">${esc(climb.reason)}</div>`;
  const fightLines=fights.filter(f=>!f.win).map(f=>f.b.type==='siege'?`<div class="small" style="margin-top:4px">⚔ ${fmtN(f.dmg)} damage to <b>${esc(f.b.name)}</b> <span class="dim">(${fmtN(f.b.hp)} HP left)</span></div>`:`<div class="small" style="margin-top:4px">☠ Struck <b>${esc(f.b.name)}</b>'s weak point: <span class="mono">${f.b.type==='str'?fmtN(f.hit)+' / '+fmtN(f.b.target)+U():f.hit+' / '+f.b.target+' reps'}</span>. Not enough yet</div>`).join('');
  render();
  openSheet(`<div class="sys gold">
    <div class="wt" style="justify-content:center;color:var(--gold)">Notification</div>
    <div class="h1">GATE CLEARED</div><div class="row" style="justify-content:center;gap:8px;margin-top:8px"><span class="tiny dim h">Clear rank</span><span class="rank r${log.crank}">${log.crank}</span></div><div class="dim small" style="margin:4px 0 12px">${esc(log.gateName)} · ${log.dur} min${log.vol?` · ${fmtN(U()==='kg'?log.vol/2.2046:log.vol)} ${U()} moved`:''}</div>
    ${res.leveled?`<div class="lvlup">LEVEL UP!</div><div class="h" style="margin-bottom:6px">Level ${res.before.L} → <span style="color:var(--gold)">${L.L}</span></div>`:''}
    ${wins.map(victoryBlock).join('')}
    <div class="win" style="text-align:left;margin-top:12px"><div class="wt">Rewards</div>
     ${parts.map(p=>`<div class="row between small" style="padding:3px 0"><span>${esc(p[0])}</span><span class="mono" style="color:var(--cyan)">+${fmtN(p[1])} EXP</span></div>`).join('')}
     
     <div class="row between" style="border-top:1px solid rgba(110,200,255,.2);margin-top:6px;padding-top:6px"><b>Total</b><b class="mono" style="color:var(--gold)">+${fmtN(log.xp)} EXP</b></div>
    </div>
    <div class="win" style="text-align:left;--zc:${zoneOf(T.floor).c}"><div class="wt" style="color:${zoneOf(T.floor).c}">Tower · Floor ${T.floor}</div>${towerLine}
     ${T.floor>fl0&&!wins.some(w=>w.boss.kind==='tower')?`<div class="small" style="color:var(--green);margin-top:4px">▲ Ascended to floor ${T.floor}</div>`:''}
     ${climb.spawned?`<div class="small" style="color:var(--red);margin-top:4px">⚠ A guardian awaits on floor ${climb.spawned}</div>`:''}${fightLines}</div>
    ${drop?`<div class="win" style="text-align:left"><div class="wt" style="color:var(--gold)">Loot</div><div class="small">🎁 ${itemHtml(drop)}</div></div>`:''}
    ${newPRs.length?`<div class="win" style="text-align:left"><div class="wt" style="color:var(--gold)">Skill level up</div>${newPRs.map(({d,b})=>`<div class="small" style="padding:3px 0">★ ${esc(d.name)} — <span class="mono">${prText(d,b)}</span></div>`).join('')}</div>`:''}
    <div class="tiny dim" style="margin:4px 0 10px">EXP ${fmtN(L.into)} / ${fmtN(L.need)} to level ${L.L+1}</div>
    <div class="bar"><i style="width:${L.into/L.need*100}%"></i></div>
    ${VIEWER?`<button class="btn pri block" style="margin-top:16px" data-a="export">Back up now (progress isn't saved)</button>`:''}
    <button class="btn gold block" style="margin-top:${VIEWER?8:16}px" data-a="close">Continue</button></div>`,{center:true});
}

  const un=myth?pick(UNIQ.filter(x=>x.r==='m')):!src.emblem&&!src.cls&&Math.random()<0.4?(pool=>pool.length?pick(pool):null)(UNIQ.filter(x=>x.r===r)):null;

  const name=un?un.name:src.boss?`${src.boss.name.replace(/^The /,'')}'s ${base}`:src.emblem?`${src.emblem}-Rank Emblem`:src.cls?`${className()}'s ${base}`:`${pick(PREFIX[r])} ${base}${Math.random()<.5?' of the '+zoneOf(S.tower.floor).n.replace(/^The /,''):''}`;
  const stat=un?un.stat:src.cls?CLASSES[S.hunter.cls].stat:pick(Object.keys(STATS));
  const it={id:'i'+uid(),name,slot,r,stat,sv:RSTAT[r],xp:RXP[r],src:src.boss?`Floor ${src.boss.ref} guardian`:src.emblem?'Rank exam':src.cls?'Class trial':'Gate drop',t:Date.now()};if(un)it.u=un.u;

const DROP_W={E:{p:.10,w:[70,25,5,0]},D:{p:.12,w:[60,30,9,1]},C:{p:.15,w:[50,33,14,3]},B:{p:.18,w:[40,36,19,5]},A:{p:.22,w:[30,38,25,7]},S:{p:.26,w:[20,38,32,10]}};
function wRoll(w,keys){const t=w.reduce((a,b)=>a+b,0);let x=Math.random()*t;for(let i=0;i<w.length;i++){x-=w[i];if(x<0)return keys[i]}return keys[keys.length-1]}
function rollDrop(log){if(log.sets<5)return null;const D=DROP_W[log.crank]||DROP_W.E;if(Math.random()>D.p)return null;return dropItem(wRoll(D.w,['c','r','e','l']))}

/* ---------- bosses ---------- */
function pickStrength(prefer,tier){
  let id=null;for(const p of prefer||[]){if(S.prs[p]&&S.prs[p].m>0&&exInfo(p).type==='w'){id=p;break}}
  if(!id){const big=['bench','squat','deadlift','ohp'].filter(x=>S.prs[x]&&S.prs[x].m>0);
    if(big.length)id=big[tier%big.length];else{const ws=Object.entries(S.prs).filter(([x,p])=>exInfo(x).type==='w'&&p.m>0).sort((a,b)=>b[1].m-a[1].m);if(ws.length)id=ws[0][0]}}
  if(id){const p=S.prs[id];let r=Math.round(p.r)||1;if(r>10)r=5;const goal=p.m*(1.02+0.004*tier);const inc=U()==='kg'?2.5:5;
    const w=Math.ceil((r<=1?goal:goal/(1+r/30))/inc)*inc;return{type:'str',ex:id,w,r,target:r<=1?w:w*(1+r/30),start:p.m,best:0}}
  const bw=Object.entries(S.prs).filter(([x,p])=>exInfo(x).type==='bw'&&p.m>0).sort((a,b)=>b[1].m-a[1].m)[0];
  if(bw){const r0=bw[1].m;return{type:'bw',ex:bw[0],target:r0+Math.max(2,Math.ceil(r0*.1)),start:r0,best:0}}
  return null}
function makeSiege(tier,mult=1){const since=Date.now()-28*864e5;const sets=LOGS.filter(l=>new Date(l.date).getTime()>=since).reduce((s,l)=>s+(l.sets||0),0);
  const max=Math.max(20,Math.round(sets/4*1.2*(1+.02*tier)*mult))*100;return{type:'siege',hp:max,max,deadline:endOfDay(7)}}
function makeTrial(tid,tier){return{type:'trial',trial:tid,par:TRIALS[tid].par(tier),tries:0}}
function buildBoss(spec,tier){let b=null;
  if(spec.type==='str'){b=pickStrength(spec.ex,tier);if(!b)b=makeTrial(spec.fallback||'gauntlet',tier)}
  else if(spec.type==='siege')b=makeSiege(tier,spec.mult);else b=makeTrial(spec.trial,tier);
  return Object.assign(b,{id:'b'+uid(),tier,spawned:Date.now(),seen:false})}
function spawnTower(f){if(S.bosses.some(b=>b.kind==='tower'))return;const t=TOWER_TYPES[f]||[['str'],['siege'],['trial','plank']][(f/10)%3];const [n,ep,ic]=guardian(f);
  S.bosses.push(Object.assign(buildBoss({type:t[0],trial:t[1],mult:f===100?1.5:1,fallback:'gauntlet'},Math.min(10,f/10)),{kind:'tower',ref:f,name:n,ep,icon:ic}))}
function spawnExam(r){const e=EXAMS[r];S.bosses.push(Object.assign(buildBoss({...e,fallback:'burpee'},e.tier),{kind:'exam',ref:r,name:`${r}-Rank Examiner`,ep:'Prove you belong in the next rank',icon:r}))}

function bossGoal(b){const d=b.ex?exInfo(b.ex):null;
  if(b.type==='str')return`Complete a set of <b>${esc(d.name)}</b> at <b>${b.w}${U()} × ${b.r}</b> or better (any set with an estimated 1-rep max of ${fmtN(b.target)}${U()}+) in any workout.`;
  if(b.type==='bw')return`Complete a single set of <b>${b.target}+ ${esc(d.name)}</b> in any workout.`;
  if(b.type==='siege')return`Deal <b>${fmtN(b.max)}</b> damage before time runs out. Every point of work in any workout deals 100 damage: a weighted set is 100, a bodyweight set 80, a 30-second hold about 35.`;
  const T=TRIALS[b.trial],best=S.trialBests[b.trial];
  return`<b>${esc(T.name)}:</b> ${esc(T.desc)} ${T.better==='low'?'Finish within':'Hold for at least'} the par of <b>${fmtT(b.par)}</b>${best!=null?`, or beat your best of <b>${fmtT(best)}</b>`:''}.`}

function defeatBoss(b){S.bosses=S.bosses.filter(x=>x.id!==b.id);const R=bossReward(b);const rw={boss:b,xp:Math.round(R.xp*(1+xpBonus())),items:[],lines:[]};
  if(b.kind==='tower'){S.tower.beaten.push(b.ref);S.tower.floor=b.ref+1;S.tower.steps=0;S.tower.misses=0;rw.items.push(dropItem(R.r,{boss:b}));

  else if(b.kind==='exam'){S.rankPassed=b.ref;rw.items.push(dropItem(R.r,{emblem:b.ref}));rw.lines.push(`You are now ${/^[AE]/.test(b.ref)?'an':'a'} ${b.ref}-Rank Hunter`)}
  else{S.hunter.tier=b.ref;rw.items.push(dropItem(R.r,{cls:true}));rw.lines.push(`Class advanced to ${className()} (+${CLASS_BONUS.stat[b.ref]} ${CLASSES[S.hunter.cls].stat}, +${Math.round(CLASS_BONUS.xp[b.ref]*100)}% EXP)`)}

function bossesOnRaid(log){const out=[];

    if(b.type==='siege'){const dmg=Math.round((log.work!=null?log.work:log.sets)*100);b.hp=Math.max(0,b.hp-dmg);const o={b,dmg};if(b.hp<=0)o.win=defeatBoss(b);out.push(o);continue}

/* ---------- climbing ---------- */
function awardSteps(log){const T=S.tower,ds=today(new Date(log.date));
  if(log.sets<5&&cardioMin(log)<20)return{amt:0,reason:'Too short to climb: needs 5+ sets or 20+ cardio minutes'};
  if(S.bosses.some(b=>b.kind==='tower')){const g=S.bosses.find(b=>b.kind==='tower');return{amt:0,reason:`${g.name} blocks the stairs. Defeat the guardian to keep climbing`}}
  if(T.dayD!==ds){T.dayD=ds;T.dayAmt=0}
  const p=planFor(ds);let amt=.5,reason=S.plan?'Off-plan workout':'No training cycle set';
  if(p&&!p.rest&&p.gate.id===log.gateId&&!logsOn(ds).some(l=>l.gateId===log.gateId)){amt=1;reason='Planned workout'}
  else if(S.plan){const y=addDays(ds,-1),py=planFor(y);if(py&&!py.rest&&y>=S.plan.start&&!logsOn(y).length)reason='Make-up for yesterday'}
  amt=Math.min(amt,1-T.dayAmt);if(amt<=0)return{amt:0,reason:'Daily climb limit reached (1 step per day)'};
  T.dayAmt+=amt;T.misses=0;T.steps+=amt;const floors=[];let spawned=null;
  while(T.steps>=4){T.steps-=4;T.floor++;floors.push(T.floor);if(T.floor%10===0&&!T.beaten.includes(T.floor)){T.steps=0;spawnTower(T.floor);spawned=T.floor;break}}
  return{amt,reason,floors,spawned}}
function rollTower(){if(!S.hunter)return;const T=S.tower,t=today(),yd=addDays(t,-1);let changed=false;
  if(S.plan){if(!T.lastEval||T.lastEval>yd)T.lastEval=yd;
    let d=addDays(T.lastEval,1),guard=0;if(d<S.plan.start)d=S.plan.start;
    while(d<=yd&&guard++<400){const p=planFor(d);if(p&&!p.rest){if(logsOn(d).length)T.misses=0;else{T.misses++;if(T.misses>=3){if(T.steps>0){T.steps=0;T.regen=true}T.misses=0}}}d=addDays(d,1)}
    if(T.lastEval!==yd){T.lastEval=yd;changed=true}}
  S.bosses.forEach(b=>{if(b.type==='siege'&&Date.now()>b.deadline&&b.hp>0){const nb=makeSiege(b.tier,b.ref===100?1.5:1);b.hp=nb.max;b.max=nb.max;b.deadline=nb.deadline;b.escaped=(b.escaped||0)+1;b.notice=true;changed=true}});
  if(T.floor%10===0&&!T.beaten.includes(T.floor)&&!S.bosses.some(b=>b.kind==='tower')){spawnTower(T.floor);changed=true}
  if(rIdx(lvlRank())>rIdx(curRank())&&!S.bosses.some(b=>b.kind==='exam')){spawnExam(RANK_ORDER[rIdx(curRank())+1]);changed=true}
  if(changed)persist()}

function swTick(){const el=$('#swT');if(!el){clearInterval(SW.timer);return}const s=(SW.acc+(SW.on?Date.now()-SW.t0:0))/1000;el.textContent=fmtT(Math.floor(s));const inp=$('#trialIn');if(inp&&SW.on)inp.value=fmtT(Math.floor(s))}
function parseT(v){v=String(v).trim();if(!v)return null;let m=v.match(/^(\d+):(\d{1,2})$/);if(m)return(+m[1])*60+(+m[2]);m=v.match(/^\d+(\.\d+)?$/);if(m)return Math.round(parseFloat(v)*60);return null}
function submitTrial(id){const b=S.bosses.find(x=>x.id===id);if(!b)return;const v=parseT($('#trialIn').value);if(v==null||v<=0){toast('Enter a time like 12:45.','red');return}
  const T=TRIALS[b.trial],prev=S.trialBests[b.trial];const better=x=>T.better==='low'?x<prev:x>prev;
  const win=(T.better==='low'?v<=b.par:v>=b.par)||(prev!=null&&better(v));
  if(prev==null||better(v))S.trialBests[b.trial]=v;b.tries=(b.tries||0)+1;clearInterval(SW.timer);
  if(!win){persist();closeSheet();sfx('error');toast(`${fmtT(v)}: <b>${esc(b.name)}</b> endures. Rest up and try again.`,'red','[Boss]',true);render();return}
  const rw=defeatBoss(b);const res=gainXp(rw.xp);rollTower();checkAch();persist(null,true);closeSheet();render();showVictory([rw],res)}

function pickerBody(sl,tab){const eqId=S.equip[sl];const ord='mlerc';

  const card=(g,n)=>{const u=UNIQM[g.u],R=RAR[g.r],on=g.id===eqId,d=gearDesc(g);return`<button class="pk ${on?'on':''} ${g.r==='m'?'myth':''}" data-a="pick-gear" data-id="${g.id}" style="--rc:${R.col}"><div class="row" style="gap:8px;align-items:flex-start"><div class="pki">${SLOT_ICON[sl]}</div><div class="grow" style="text-align:left"><div class="h" style="color:${R.col}">${esc(g.name)}${n>1?` <span class="tiny dim">×${n}</span>`:''}</div>

  if(tab==='std'){const mine=own.filter(g=>!g.u).sort((a,b)=>(b.id===eqId)-(a.id===eqId)||ord.indexOf(a.r)-ord.indexOf(b.r)||b.t-a.t);
    const cat=stdCatalog(sl),catKeys=new Set(cat.map(c=>c.key));const groups=[],seen={};
    mine.forEach(g=>{const k=catKeys.has(stdKey(g))?stdKey(g):'id:'+g.id;if(seen[k]){seen[k].n++;if(g.id===eqId)seen[k].g=g;return}seen[k]={g,n:1};groups.push(seen[k])});
    const missing=cat.filter(c=>!seen[c.key]).sort((a,b)=>ord.indexOf(b.r)-ord.indexOf(a.r));
    const ghostStd=c=>{const d=(c.r==='e'||c.r==='l')?STD_LORE[c.px]:'';return`<button class="pk lock" data-a="pick-locked"><div class="row" style="gap:8px;align-items:flex-start"><div class="pki">${SLOT_ICON[sl]}</div><div class="grow" style="text-align:left"><div class="h">${esc(c.name)}</div><div class="tiny h">${RAR[c.r].n} · not found</div>${d?`<div class="tiny pkd">“${esc(d)}”</div>`:''}<div class="tiny">+${Math.round(RXP[c.r]*100)}% EXP · +${RSTAT[c.r]} stat</div></div></div></button>`};
    return groups.map(x=>card(x.g,x.n)).join('')+missing.map(ghostStd).join('')}
  const groups=[],seen={};

  const missing=UNIQ.filter(u=>u.slot===sl&&!own.some(g=>g.u===u.u)).sort((a,b)=>ord.indexOf(b.r)-ord.indexOf(a.r));

  return groups.map(x=>card(x.g,x.n)).join('')+missing.map(ghost).join('')}
function pickerTabs(sl,tab){const own=S.gear.filter(g=>g.slot===sl);const cat=stdCatalog(sl),ownKeys=new Set(own.filter(g=>!g.u).map(stdKey));const nStd=`${cat.filter(c=>ownKeys.has(c.key)).length}/${cat.length}`;

  </div>
  <div class="raidfoot"><div class="in"><button class="btn red" data-a="retreat">Retreat</button><button class="btn gold grow" data-a="finish">Clear gate</button></div></div>`;
  tickElapsed();clearInterval(raidTick);raidTick=setInterval(tickElapsed,1000);setTimeout(fitScreen,0);
}

/* ---------- circuit runner ---------- */
let CIRC=null;
function startCircuit(start,n){const a=S.active;if(!a)return;stopRest();const moves=[];for(let k=start;k<start+n;k++)moves.push(k);
  const rounds=Math.max(...moves.map(k=>a.ex[k].sets.length));const q=[];for(let r=0;r<rounds;r++)moves.forEach((k,p)=>{const s=a.ex[k].sets[r];if(s&&!s.done)q.push([k,r,CEV()>0&&(p+1)%CEV()===0])});
  if(!q.length)return;voiceUnlock();CIRC={on:true,q,i:0,phase:'prep',end:Date.now()+3000,paused:false,left:0,lastBeep:null,started:false};
  $('#circ').classList.add('on');clearInterval(CIRC.timer);CIRC.timer=setInterval(tickCirc,200);sfx('blip');raidRerender();tickCirc()}
function circMove(){const c=CIRC,a=S.active;if(!c||!a)return null;const [ei,si]=c.q[c.i]||[];if(ei==null||!a.ex[ei])return null;return{ei,si,d:exInfo(a.ex[ei].id),s:a.ex[ei].sets[si]}}
function tickCirc(){const c=CIRC;if(!c||!c.on)return;if(!S.active){stopCirc();return}const m=circMove();if(!m){finishCirc();return}
  const left=c.paused?c.left:Math.max(0,(c.end-Date.now())/1000);const sec=Math.ceil(left);
  const nx=c.q[c.i+1]?exInfo(S.active.ex[c.q[c.i+1][0]].id).name:'Finish';
  $('#circPh').textContent=c.phase==='rest'?'Rest · up next':c.phase==='prep'?'Get ready':'Go';$('#circPh').style.color=c.phase==='rest'?'var(--cyan)':c.phase==='prep'?'var(--gold)':'var(--green)';
  $('#circName').textContent=m.d.name;$('#circT').textContent=sec;$('#circNext').textContent=c.phase!=='work'?`${c.i+1} / ${c.q.length}`:`Next: ${nx} · ${c.i+1} / ${c.q.length}`;
  const total=c.phase!=='work'?Math.max(1,c.prepLen||3):Math.max(1,(+m.s.r||0.5)*60);$('#circB').style.width=(left/total*100)+'%';
  $('#circPause').textContent=c.paused?'Resume':'Pause';
  if(c.paused)return;
  if(sec<=3&&sec>0&&c.lastBeep!==c.phase+sec+c.i){c.lastBeep=c.phase+sec+c.i;beepTick(c.phase==='work'?880:660)}
  if(left<=0){
    if(c.phase==='prep'||c.phase==='rest'){say(c.started?'Next':'Start');c.started=true;c.phase='work';const dur=Math.max(1,(+m.s.r||0.5)*60);c.end=Date.now()+dur*1000;sfx('hit');buzz(60)}
    else{m.s.done=true;if(!m.s.r)m.s.r=0.5;sfx(S.active.ex[m.ei].sets.every(x=>x.done)?'slain':'hit');buzz([60,40,60]);persist();c.i++;
      if(c.i>=c.q.length){finishCirc();return}
      if(c.q[c.i-1][2]){c.phase='rest';c.prepLen=CRS();c.end=Date.now()+CRS()*1000;sfx('blip');say('Rest')}else{const p=S.circPrep??5;if(p>0){c.phase='prep';c.prepLen=p;c.end=Date.now()+p*1000}else{const nm=circMove();say('Next');c.phase='work';c.end=Date.now()+Math.max(1,(+nm.s.r||0.5)*60)*1000}}
      raidRerender()}}}
function skipCirc(){const c=CIRC;if(!c)return;c.paused=false;
  if(c.phase==='prep'||c.phase==='rest'){c.end=Date.now();tickCirc();return}
  c.i++;if(c.i>=c.q.length){finishCirc();return}if(c.q[c.i-1][2]){c.phase='rest';c.prepLen=CRS();c.end=Date.now()+CRS()*1000;say('Rest');raidRerender();tickCirc();return}const p=S.circPrep??5;if(p>0){c.phase='prep';c.prepLen=p;c.end=Date.now()+p*1000}else{const nm=circMove();c.phase='work';c.end=Date.now()+Math.max(1,(+nm.s.r||0.5)*60)*1000}raidRerender();tickCirc()}
function say(w){try{const ss=window.speechSynthesis;if(!ss||S.voice===false)return;ss.cancel();const u=new SpeechSynthesisUtterance(w);u.rate=1.05;u.pitch=1;u.volume=1;ss.speak(u)}catch(e){}}
function voiceUnlock(){try{const ss=window.speechSynthesis;if(!ss)return;const u=new SpeechSynthesisUtterance(' ');u.volume=0;ss.speak(u)}catch(e){}}
function beepTick(f){try{tone(f,0,.08,{type:'square',g:.06})}catch(e){}}
function stopCirc(){if(CIRC){clearInterval(CIRC.timer);CIRC.on=false}CIRC=null;const el=$('#circ');if(el)el.classList.remove('on')}
function finishCirc(){stopCirc();say('End');sfx('quest');buzz([80,50,160]);toast('Core circuit complete.','gold','[System]',true);if(S.active&&RAID_VIEW)raidRerender()}

/* ---------- PR rebuild ---------- */
function rebuildPRs(){const prs={};LOGS.slice().sort((a,b)=>a.date<b.date?-1:1).forEach(l=>l.ex.forEach(e=>{const d=exInfo(e.id);const b=bestMetric(d,e.sets);if(b&&(!prs[e.id]||b.m>prs[e.id].m))prs[e.id]={...b,date:l.date}}));S.prs=prs}

function saveLogEdit(){const l=LOGS.find(x=>x.id===LED.id);if(!l)return;const k=U()==='kg'?2.2046:1;
  l.ex=LED.ex.map(e=>({id:e.id,sets:e.sets.filter(s=>(+s.r||0)>0).map(s=>{const o={w:+s.w||0,r:+s.r||0};if(s.wu)o.wu=1;return o})})).filter(e=>e.sets.length);
  l.sets=l.ex.reduce((s,e)=>s+e.sets.length,0);l.vol=Math.round(l.ex.reduce((s,e)=>s+(exInfo(e.id).type==='w'?e.sets.reduce((a,x)=>a+x.w*x.r*k,0):0),0));
  l.dur=Math.max(1,Math.round(+LED.dur||l.dur));l.prs=(l.prs||[]).filter(id=>l.ex.some(e=>e.id===id));
  rebuildPRs();checkAch();persist([l.date.slice(0,7)],true);closeSheet();render();toast('Raid updated. Records recalculated.')}

/* ---------- per-exercise progress chart ---------- */
let CH={id:null,m:'e1rm'};
function chartSeries(id,m){const d=exInfo(id);const out=[];
  LOGS.slice().sort((a,b)=>a.date<b.date?-1:1).forEach(l=>{const e=l.ex.find(x=>x.id===id);if(!e)return;const ws=e.sets.filter(s=>!s.wu);if(!ws.length)return;let v;
    if(d.type==='w'){if(m==='top')v=Math.max(...ws.map(s=>+s.w||0));else if(m==='vol')v=ws.reduce((a,s)=>a+(+s.w||0)*(+s.r||0),0);else{const b=bestMetric(d,ws);v=b?b.m:0}}
    else if(d.type==='t')v=Math.max(...ws.map(s=>+s.r||0))*(isSec(d)?60:1);else v=Math.max(...ws.map(s=>+s.r||0));
    if(v>0)out.push({date:l.date,v,sets:e.sets})});return out}
function openChart(id){CH={id,m:'e1rm'};openSheet('<div id="chs"></div>');drawChart()}
function drawChart(){const el=$('#chs');if(!el)return;const d=exInfo(CH.id);const m=d.type==='w'?CH.m:'val';const ser=chartSeries(CH.id,m);
  const unit=d.type==='w'?(m==='vol'?U()+' moved':U()):d.type==='t'?(isSec(d)?'sec':'min'):'reps';
  const label=d.type==='w'?{e1rm:'Estimated 1-rep max',top:'Heaviest set',vol:'Total volume'}[m]:d.type==='t'?'Longest set':'Most reps in a set';
  let svg='<div class="empty small">Log this exercise in a few raids to see your progress.</div>';
  if(ser.length){const W=320,H=150,P=28;const vs=ser.map(x=>x.v);let lo=Math.min(...vs),hi=Math.max(...vs);if(hi===lo){hi+=1;lo=Math.max(0,lo-1)}
    const X=i=>ser.length===1?W/2:P+i*(W-P-8)/(ser.length-1),Y=v=>8+(H-24)*(1-(v-lo)/(hi-lo));
    const pts=ser.map((x,i)=>`${X(i).toFixed(1)},${Y(x.v).toFixed(1)}`).join(' ');const fd=s=>{const t=new Date(s);return(t.getMonth()+1)+'/'+t.getDate()};
    svg=`<svg class="chart" viewBox="0 0 ${W} ${H}" width="100%"><line x1="${P}" y1="${Y(hi)}" x2="${W}" y2="${Y(hi)}" stroke="rgba(110,200,255,.15)"/><line x1="${P}" y1="${Y(lo)}" x2="${W}" y2="${Y(lo)}" stroke="rgba(110,200,255,.15)"/>
      <text x="0" y="${Y(hi)+3}">${fmtN(hi)}</text><text x="0" y="${Y(lo)+3}">${fmtN(lo)}</text>
      <polyline points="${pts}" fill="none" stroke="#7fe6ff" stroke-width="2" style="filter:drop-shadow(0 0 4px #7fe6ff)"/>
      ${ser.map((x,i)=>`<circle cx="${X(i)}" cy="${Y(x.v)}" r="3.5" fill="${i===ser.length-1?'#ffd166':'#7fe6ff'}"/>`).join('')}
      <text x="${X(0)}" y="${H-2}" text-anchor="${ser.length===1?'middle':'start'}">${fd(ser[0].date)}</text>${ser.length>1?`<text x="${W-2}" y="${H-2}" text-anchor="end">${fd(ser[ser.length-1].date)}</text>`:''}</svg>`}
  const first=ser[0],lastS=ser[ser.length-1];const ch=ser.length>1&&first.v?((lastS.v-first.v)/first.v*100):null;
  el.innerHTML=`<div class="wt">Progress<span class="sp"></span><span class="statdot s${d.stat}">${d.stat}</span></div><div class="h" style="color:#fff;font-size:18px">${esc(d.name)}</div>
   ${d.type==='w'?`<div class="seg" style="margin:10px 0">${[['e1rm','e1RM'],['top','Heaviest'],['vol','Volume']].map(([k,l])=>`<button class="${CH.m===k?'on':''}" data-a="ch-m" data-k="${k}">${l}</button>`).join('')}</div>`:''}
   <div class="tiny dim h" style="margin:6px 0">${label} (${unit})</div>${svg}
   ${ser.length?`<div class="stats" style="margin-top:10px"><div class="stat"><div class="k">Latest</div><b>${fmtN(lastS.v)}</b> <span class="tiny dim">${unit}</span></div><div class="stat"><div class="k">${ch==null?'Sessions':'Since first'}</div><b style="color:${ch==null?'#fff':ch>=0?'var(--green)':'var(--red)'}">${ch==null?ser.length:(ch>=0?'+':'')+ch.toFixed(1)+'%'}</b></div></div>
   <div class="tiny dim h" style="margin:12px 0 4px">Recent sessions</div><div class="list">${ser.slice(-8).reverse().map(x=>`<div class="item row small"><span class="dim" style="min-width:64px">${new Date(x.date).toLocaleDateString(undefined,{month:'short',day:'numeric'})}</span><span class="grow mono tiny">${x.sets.map(s=>setFmt(d,s)).join(' · ')}</span></div>`).join('')}</div>`:''}
   <button class="btn block ghost" style="margin-top:10px" data-a="close">Close</button>`}

function convertUnits(to){if(U()===to)return;const f=to==='kg'?1/2.2046:2.2046;const r=v=>v===''||v==null?v:Math.round((+v)*f*2)/2;
  LOGS.forEach(l=>l.ex.forEach(e=>{if(exInfo(e.id).type==='w')e.sets.forEach(s=>s.w=r(s.w))}));
  for(const id in S.prs){const p=S.prs[id];if(exInfo(id).type==='w'){p.w=r(p.w);p.m=p.m*f}}
  if(S.active)S.active.ex.forEach(e=>{if(exInfo(e.id).type==='w')e.sets.forEach(s=>s.w=r(s.w))});
  S.bosses.forEach(b=>{if(b.type==='str'){b.w=r(b.w);b.target*=f;b.start*=f;b.best*=f}});
  S.hunter.units=to;persist([...new Set(LOGS.map(l=>l.date.slice(0,7)))]);}

  case'equip-item':{const it=S.gear.find(g=>g.id===ds.id);if(it){S.equip[it.slot]=it.id;sfx('loot');persist();closeSheet();render()}break}
  case'unequip':{const it=S.gear.find(g=>g.id===ds.id);if(it){delete S.equip[it.slot];persist();closeSheet();render()}break}
  case'salvage':{const it=S.gear.find(g=>g.id===ds.id);if(!it||S.equip[it.slot]===it.id)return;closeSheet();confirmBox('Salvage',`Break down ${esc(it.name)} for +${SALV[it.r]} EXP?`,'Salvage',()=>{S.gear=S.gear.filter(g=>g.id!==it.id);const r=gainXp(SALV[it.r]);persist();render();toast(`Salvaged for <b>+${SALV[it.r]} EXP</b>.`);if(r.leveled)sfx('levelup')},true);break}
  case'equip':S.title=S.title===ds.id?'':ds.id;persist();render();break;
  case'penok':sfx('tick');S.daily.penaltyNote=false;persist();render();break;
  case'tab-q-pen':break;
  case'dq':case'dqmax':{const t=S.daily.tasks.find(x=>x.id===ds.id);if(!t)return;const p=S.daily.progress[t.id]||0;
    S.daily.progress[t.id]=a==='dqmax'?Math.max(p,t.target):Math.max(0,Math.min(t.target*3,p+(+ds.d)));
    if(S.daily.progress[t.id]>=t.target&&p<t.target){buzz(30);sfx('blip')}else sfx('tick');
    persist();render();break}
  case'claim':{const d=S.daily;if(d.claimed)return;const t=today();
    d.streak=(d.lastDone===yesterday())?d.streak+1:(d.lastDone===t?d.streak:1);d.lastDone=t;d.best=Math.max(d.best||0,d.streak);d.claimed=true;d.claims=(d.claims||0)+1;
    d.tasks.forEach(x=>{S.bonus[x.stat]=(S.bonus[x.stat]||0)+0.25});
    const xp=Math.round((40+5*Math.min(d.streak,10))*(1+xpBonus()));const res=gainXp(xp);rollTower();checkAch();persist(null,true);render();flash();buzz([50,30,90]);sfx('quest');
    toast(`Daily quest complete. <b>+${xp} EXP</b> · Streak ${d.streak}`,'gold','[Quest]',true);
    if(res.leveled)setTimeout(()=>{toast(`<b>LEVEL UP!</b> You are now level ${res.after.L}.`,'gold','[System]',true);sfx('levelup')},700);break}
  case'enter':{const g=S.gates.find(x=>x.id===ds.id);if(g)startRaid(g);break}
  case'quickraid':startRaid(null);break;
  case'resume':RAID_VIEW=true;renderRaid();break;
  case'minraid':RAID_VIEW=false;render();break;
  case'done':{const es=S.active.ex[+ds.ei].sets,s=es[+ds.si];const pv=es[+ds.si-1];if(!s.done&&pv){if(s.w===''&&pv.w!=='')s.w=pv.w;if(s.r===''&&pv.r!=='')s.r=pv.r}s.done=!s.done;if(s.done){buzz(25);sfx(es.every(x=>x.done)?'slain':'hit');const ce=S.active.ex[+ds.ei];let skip=false;let restLen=0;{const run=circuitRuns(S.active).find(r=>+ds.ei>=r[0]&&+ds.ei<r[0]+r[1]);if(run){const pos=+ds.ei-run[0];if(CEV()&&(pos+1)%CEV()===0)restLen=CRS();else{restLen=0}}}if(ce.ss){const grp=S.active.ex.filter(x=>x.ss===ce.ss);const k=+ds.si;skip=grp.some(x=>x!==ce&&x.sets[k]&&!x.sets[k].done)}if(skip){stopRest()}else if(restLen>0)startRest(restLen)}persist();const y=$('#raid').scrollTop;renderRaid();$('#raid').scrollTop=y;break}
  case'addset':{const e=S.active.ex[+ds.ei];const l=e.sets[e.sets.length-1]||{w:'',r:''};e.sets.push({w:l.w,r:l.r,done:false});persist();const y=$('#raid').scrollTop;renderRaid();$('#raid').scrollTop=y;break}
  case'rmset':{const e=S.active.ex[+ds.ei];if(e.sets.length>1)e.sets.pop();persist();const y=$('#raid').scrollTop;renderRaid();$('#raid').scrollTop=y;break}
  case'rmex':confirmBox('Banish monster','Remove this exercise from the current raid?','Remove',()=>{S.active.ex.splice(+ds.ei,1);persist();renderRaid()});break;
  case'raidadd':openPicker(id=>{const d=exInfo(id);S.active.ex.push(newRaidEx(id,3,d.type==='t'?20:''));persist();renderRaid();setTimeout(()=>{$('#raid').scrollTop=$('#raid').scrollHeight},30)});break;
  case'restset':{const el=openSheet(`<div class="wt">Rest timer</div><div class="seg">${[0,45,60,90,120,180,240].map(s=>`<button class="${S.rest===s?'on':''}" data-a="restpick" data-s="${s}">${s?s+'s':'Off'}</button>`).join('')}</div>`,{center:true});break}
  case'restpick':S.rest=+ds.s;persist();closeSheet();renderRaid();break;
  case'rest':restEnd+=(+ds.d)*1000;restTotal=Math.max(restTotal,(restEnd-Date.now())/1000);if(restEnd<=Date.now())stopRest();else tickRest();break;
  case'restskip':stopRest();break;
  case'retreat':confirmBox('Retreat','Abandon this raid? Nothing from this session will be logged.','Retreat',()=>{S.active=null;stopRest();stopCirc();clearInterval(raidTick);persist();$('#raid').classList.add('hide');render();sfx('retreat');toast('You escaped the gate.','red','[System]',true)},true);break;
  case'finish':{const a2=S.active;const open=a2.ex.reduce((s,e)=>s+e.sets.filter(x=>!x.done).length,0);const dn=a2.ex.reduce((s,e)=>s+e.sets.filter(x=>x.done).length,0);
    if(open&&dn)confirmBox('Clear gate',`${open} set${open>1?'s are':' is'} still unchecked and won't be logged. Finish anyway?`,'Finish',finishRaid);else finishRaid();break}
  case'plan':openPlanEditor();break;
  case'pe-pre':PE.start=$('#peStart').value||PE.start;applyPreset(+ds.on,+ds.off);drawPlanEditor();break;
  case'pe-add':PE.start=$('#peStart').value||PE.start;PE.cycle.push('rest');drawPlanEditor();break;
  case'pe-rm':PE.start=$('#peStart').value||PE.start;PE.cycle.pop();drawPlanEditor();break;
  case'pe-save':{const st=$('#peStart').value;if(!/^\d{4}-\d{2}-\d{2}$/.test(st)){toast('Pick a start date.','red');return}PE.start=st;if(!PE.cycle.some(x=>x!=='rest')){toast('Add at least one training day.','red');return}
    S.plan={start:PE.start,cycle:PE.cycle.slice()};persist();closeSheet();render();const p=planFor(today());toast(p.rest?'Cycle set. Today is a rest day.':`Cycle set. Today's gate: <b>${esc(p.gate.name)}</b>.`,'','[System]');break}
  case'pe-clear':confirmBox('Turn off cycle','Remove your training schedule? Gates and history are kept.','Turn off',()=>{S.plan=null;persist();closeSheet();render()},true);break;
  case'newgate':openGateEditor(null);break;
  case'editgate':openGateEditor(S.gates.find(x=>x.id===ds.id));break;
  case'ge-rank':EDIT.rank=ds.r;drawGateEditor();break;
  case'ge-up':{const i=+ds.i;if(i<1)break;[EDIT.ex[i-1],EDIT.ex[i]]=[EDIT.ex[i],EDIT.ex[i-1]];drawGateEditor();break}
  case'ge-down':{const i=+ds.i;if(i>=EDIT.ex.length-1)break;[EDIT.ex[i+1],EDIT.ex[i]]=[EDIT.ex[i],EDIT.ex[i+1]];drawGateEditor();break}
  case'ge-rm':EDIT.ex.splice(+ds.i,1);drawGateEditor();break;
  case'ge-add':openPicker(id=>{const d=exInfo(id);EDIT.ex.push({id,sets:d.type==='t'?1:3,reps:d.type==='t'?20:10});drawGateEditor()});break;
  case'ge-save':{if(!EDIT.name.trim()){toast('Name your gate.','red');return}if(!EDIT.ex.length){toast('Add at least one exercise.','red');return}
    const L='ABCDEFGHIJ';let li=0;const exs=EDIT.ex.map(e=>{const o={id:e.id,sets:e.sets,reps:e.reps};if(+e.rmax>+e.reps)o.rmax=+e.rmax;if(e.wu)o.wu=1;return o});
    for(let q=0;q<EDIT.ex.length;q++){if(EDIT.ex[q].ssn&&exs[q+1]){const tag=exs[q].ss||L[li++%10];exs[q].ss=tag;exs[q+1].ss=tag}}
    const g={id:EDIT.id,name:EDIT.name.trim(),rank:'E',lore:EDIT.lore,ex:exs};g.rank=assessRank(g);const i=S.gates.findIndex(x=>x.id===g.id);if(i>=0)S.gates[i]=g;else S.gates.push(g);
    checkAch();persist();closeSheet();render();toast(`Gate <b>${esc(g.name)}</b> ${i>=0?'updated':'forged'}.`);break}
  case'ge-del':{const id=EDIT.id;confirmBox('Delete gate',`Delete <b>${esc(EDIT.name)}</b>? Your raid history is kept.`,'Delete',()=>{S.gates=S.gates.filter(x=>x.id!==id);if(S.plan)S.plan.cycle=S.plan.cycle.map(v=>v===id?'rest':v);persist();closeSheet();render()},true);break}
  case'pick':pickDone(ds.id);break;
  case'cx-add':{const n=$('#cxn').value.trim();if(!n){toast('Name the exercise.','red');return}const x={id:'c'+uid(),name:n,stat:$('#cxs').value,type:$('#cxt').value};S.custom.push(x);persist();pickDone(x.id);break}
  case'dellog':confirmBox('Delete entry','Remove this raid from your chronicle? EXP already earned is kept.','Delete',()=>{const l=LOGS.find(x=>x.id===ds.id);LOGS=LOGS.filter(x=>x.id!==ds.id);rebuildPRs();persist(l?[l.date.slice(0,7)]:[]);render()},true);break;
  case'sfx':S.sfx=ds.v==='1';persist();drawSettings();if(S.sfx)sfx('blip');break;
  case'sfxtest':{const seq=['hit','slain','quest','clear','levelup'];seq.forEach((n,i)=>setTimeout(()=>sfx(n),i*1100));break}
  case'sbx-in':{if(SANDBOX)return;flushSave();saveTimer=null;SNAP={s:S,logs:LOGS};const cp=ds.k==='copy';S=cp?JSON.parse(JSON.stringify(S)):defaults();LOGS=cp?JSON.parse(JSON.stringify(LOGS)):[];
    SANDBOX=true;document.body.classList.add('sbx');stopRest();RAID_VIEW=true;OB={step:0,name:'',cls:'warrior',units:U()};while(sheets.length)closeSheet();if(S.hunter){rollDaily();rollTower()}TAB='status';render();toast('Test mode on. Nothing you do here is saved.','gold','[System]',true);break}
  case'sbx-exit':{if(!SANDBOX)return;S=SNAP.s;LOGS=SNAP.logs;const push=SNAP.push;SNAP=null;SANDBOX=false;document.body.classList.remove('sbx');stopRest();clearInterval(raidTick);RAID_VIEW=true;while(sheets.length)closeSheet();
    if(push&&push.length)persist(push,true);else if(cloudCol&&(FAILED.size||SNAP_DIRTY))retrySync();else try{localStorage.setItem(LS,JSON.stringify({s:S,logs:LOGS}))}catch(_){}
    if(S.hunter)rollDaily();render();toast('Test mode off. Your real progress is back.');break}
  case'units':convertUnits(ds.u);drawSettings();render();break;
  case'dq-add':S.daily.tasks.push({id:'d'+uid(),name:'New goal',target:10,unit:'reps',stat:'STR'});persist();drawSettings();break;
  case'dq-rm':S.daily.tasks.splice(+ds.i,1);persist();drawSettings();render();break;
  case'export':{const txt=JSON.stringify({app:'gatebreaker',s:S,logs:LOGS});
    const done=()=>toast('Backup copied. Paste it somewhere safe (notes, email).');
    if(navigator.clipboard&&navigator.clipboard.writeText)navigator.clipboard.writeText(txt).then(done,()=>showText(txt));else showText(txt);break}
  case'import':{const el=openSheet(`<div class="wt">Restore backup</div><textarea class="f" id="imp" rows="6" placeholder="Paste backup text here"></textarea><div class="row" style="margin-top:10px"><button class="btn grow" data-a="close">Cancel</button><button class="btn pri grow" id="impGo">Restore</button></div>`,{center:true});
    el.querySelector('#impGo').onclick=()=>{try{const o=JSON.parse(el.querySelector('#imp').value);if(!o||o.app!=='gatebreaker'||!o.s||!o.s.hunter)throw 0;S=Object.assign(defaults(),o.s);LOGS=o.logs||[];persist([...new Set(LOGS.map(l=>l.date.slice(0,7)))],true);while(sheets.length)closeSheet();render();toast('Backup restored.')}catch(_){toast('That doesn’t look like an Arise backup.','red')}};break}
  case'reset':confirmBox('Reset hunter','Erase your hunter, gates and all history? This cannot be undone.','Erase everything',async()=>{
    const months=[...new Set(LOGS.map(l=>l.date.slice(0,7)))];S=defaults();LOGS=[];OB={step:0,name:'',cls:'warrior',units:'lb'};
    if(!SANDBOX)try{localStorage.removeItem(LS)}catch(_){}
    if(cloudCol&&!SANDBOX){try{await cloudCol.doc(SAVE_ID).delete();await cloudCol.doc('save').delete();for(const m of months){await cloudCol.doc(LOGP+m).delete();await cloudCol.doc('log-'+m).delete()}}catch(_){}}
    while(sheets.length)closeSheet();render()},true);break;
  }
});
function showText(txt){const el=openSheet(`<div class="wt">Backup</div><div class="small dim">Select all and copy this text:</div><textarea class="f" rows="7" readonly>${esc(txt)}</textarea><button class="btn block" style="margin-top:10px" data-a="close">Close</button>`,{center:true});el.querySelector('textarea').select()}

document.addEventListener('input',e=>{const t=e.target;
  if(t.dataset.ei!==undefined&&t.dataset.k&&S.active){const s=S.active.ex[+t.dataset.ei]?.sets[+t.dataset.si];if(s){if(t.dataset.k==='w')setWeight(+t.dataset.ei,+t.dataset.si,t.value);else s.r=tFrom(t.dataset.u==='sec',t.value);persist()}return}
  if(t.dataset.lei!==undefined&&LED){const x=LED.ex[+t.dataset.lei].sets[+t.dataset.lsi];if(x)x[t.dataset.lk]=t.dataset.lk==='r'?tFrom(t.dataset.u==='sec',t.value):t.value;return}
  if(t.dataset.led&&LED){LED.dur=t.value;return}
  if(t.dataset.ge&&EDIT){EDIT[t.dataset.ge]=t.value;return}
  if(t.dataset.gi!==undefined&&EDIT&&t.type==='checkbox'){EDIT.ex[+t.dataset.gi][t.dataset.gk]=t.checked?(t.dataset.gk==='wu'?1:true):0;geRankUpd();return}
  if(t.dataset.gi!==undefined&&EDIT){const v=t.value;const n=t.dataset.u==='sec'?(+v)/60:+v;EDIT.ex[+t.dataset.gi][t.dataset.gk]=v===''?'':Math.max(t.dataset.gk==='sets'?1:0,n);geRankUpd();return}
});
document.addEventListener('change',e=>{const t=e.target;
  if(t.dataset.st){if(t.dataset.st==='name'){const v=t.value.trim();if(v)S.hunter.name=v}else if(t.dataset.st==='cls')S.hunter.cls=t.value;else if(t.dataset.st==='vol'){S.vol=+t.value;out();sfx('blip')}else if(t.dataset.st==='rest')S.rest=Math.max(0,Math.min(900,+t.value||0));persist();render();return}
  if(t.dataset.pe!==undefined&&PE){PE.cycle[+t.dataset.pe]=t.value;return}
  if(t.dataset.dq!==undefined){const x=S.daily.tasks[+t.dataset.dq];if(!x)return;const k=t.dataset.k;x[k]=k==='target'?Math.max(1,+t.value||1):t.value;persist();render();return}
});
setInterval(()=>{const c=$('#qclock');if(c)c.textContent=msToMidnight();if(S.hunter&&S.daily.date!==today()){rollDaily();rollTower();if(!S.active||$('#raid').classList.contains('hide'))render()}},1000);
document.addEventListener('visibilitychange',()=>{if(!document.hidden&&S.hunter){rollDaily();if(restEnd)tickRest()}});

if(S.hunter){if(applyPacks())persist();if(fixForge())persist();rollDaily();rollTower();const n0=S.unlocked.length;checkAch();if(S.unlocked.length>n0)persist()}
if(!S.hunter&&window.claude){BOOT=true;setTimeout(()=>{if(BOOT){BOOT=false;CLOUD_FAILED=!cloudCol&&!VIEWER;render()}},30000)}
render();
initCloud();
let WL=null;async function wakeOn(){try{if(navigator.wakeLock&&!WL){WL=await navigator.wakeLock.request('screen');WL.addEventListener('release',()=>{WL=null})}}catch(e){}}
function wakeOff(){try{WL&&WL.release()}catch(e){}WL=null}
document.addEventListener('visibilitychange',()=>{if(!document.hidden&&S.active)wakeOn()});
setInterval(()=>{if(S.active)wakeOn();else if(WL)wakeOff()},3000);
try{navigator.storage&&navigator.storage.persist&&navigator.storage.persist()}catch(e){}
if('serviceWorker' in navigator)window.addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}));
</script>
